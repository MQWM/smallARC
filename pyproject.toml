[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallarc"
version = "0.1.0"
description = "小小箭头截图识别、桌面提示与 ADB 点击工具"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "opencv-python-headless>=4.10,<6", "PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
smallarc = "arrow_solver.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

